# Portico local auth-routing deployment.
# This keeps the legacy docker-compose.yml untouched and exposes only one HTTP
# proxy port plus one SOCKS5 proxy port. Username selects the route.

services:
  worker:
    build:
      context: ./backend
      dockerfile: docker/worker/Dockerfile
    image: portico-worker
    entrypoint: ["/usr/bin/true"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: portico-auth-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_auth_data:/data
    networks:
      - proxynet
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: portico-auth-postgres
    environment:
      - POSTGRES_DB=portico
      - POSTGRES_USER=portico
      - POSTGRES_PASSWORD=portico
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - proxynet
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: docker/local-auth/Dockerfile
    image: portico-gateway-local-auth
    container_name: portico-auth-gateway
    depends_on:
      - worker
      - redis
      - postgres
    environment:
      - USE_DOCKER=1
      - AUTH_ROUTING_ENABLED=1
      - AUTH_HTTP_PORT=${AUTH_HTTP_PORT:-58680}
      - AUTH_SOCKS_PORT=${AUTH_SOCKS_PORT:-58681}
      - PROXY_GLOBAL_PASSWORD=${PROXY_GLOBAL_PASSWORD:-huzaifa}
      - DOCKER_IMAGE=portico-worker
      - DOCKER_NETWORK=proxynet
      - DOCKER_OVPN_VOLUME=ovpn_data
      - DOCKER_OVPN_MOUNT=/ovpn
      - REDIS_URL=redis://redis:6379/0
      - REDIS_STATE_KEY=portico:auth-routing-state
      - DATABASE_URL=postgresql://portico:portico@postgres:5432/portico
      # WSL Docker + ixBrowser on Windows: set IXBROWSER_API_BASE to Windows host IP
      # from WSL (grep nameserver /etc/resolv.conf), e.g. http://10.255.255.254:53200/api/v2/
      - IXBROWSER_API_BASE=${IXBROWSER_API_BASE:-http://host.docker.internal:53200/api/v2/}
      - IXBROWSER_PROXY_HOST=${IXBROWSER_PROXY_HOST:-127.0.0.1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ovpn_data:/ovpn
      - sd_farm_data:/data/sd-farm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:49999:49999"
      - "0.0.0.0:${AUTH_HTTP_PORT:-58680}:${AUTH_HTTP_PORT:-58680}"
      - "0.0.0.0:${AUTH_SOCKS_PORT:-58681}:${AUTH_SOCKS_PORT:-58681}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    stop_grace_period: 60s
    networks:
      - proxynet
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: portico-frontend
    container_name: portico-auth-frontend
    depends_on:
      - gateway
    ports:
      - "0.0.0.0:8080:80"
    networks:
      - proxynet
    restart: unless-stopped

networks:
  proxynet:
    driver: bridge

volumes:
  redis_auth_data:
  postgres_auth_data:
  ovpn_data:
    name: ovpn_data
  sd_farm_data:
